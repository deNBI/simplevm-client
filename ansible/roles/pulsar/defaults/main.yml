---
# Pulsar BYOC role for BiBiGrid clusters.
#
# This role adapts the standalone `pulsar-byoc` playbook to run *inside* a
# BiBiGrid cluster's site.yaml (via userRoles). It reuses what BiBiGrid
# already provides and only does the Pulsar-specific work:
#
#   * Slurm  -> already installed by BiBiGrid; we only add slurm-drmaa.
#   * NFS    -> reuse BiBiGrid's existing /vol/spool share (no 2nd export).
#   * user   -> reuse the existing cluster user (ubuntu), no dedicated user.
#
# The role runs on both the master (pulsar host) and the workers, branching on
# BiBiGrid's group_names (master / workers).

# ---- Scheduler & connection (fixed for the testing phase) -----------------
# BiBiGrid already provides a working Slurm cluster, so Pulsar's DRMAA layer
# attaches to it. Connection is RabbitMQ (mq) with an autogenerated account.
pulsar_scheduler: slurm
pulsar_connection: mq

# ---- Shared storage (reuse BiBiGrid's existing NFS share) ------------------
# BiBiGrid exports /vol/spool from the master and mounts it on every worker.
# Pulsar's staging/dependency dirs live there, so no second NFS export is set
# up and no separate NFS ports need to be opened.
pulsar_shared_dir: /vol/spool
pulsar_staging_dir: "{{ pulsar_shared_dir }}/staging"
pulsar_dependencies_dir: "{{ pulsar_shared_dir }}/deps"

# Reuse the existing cluster user (BiBiGrid uses 'ubuntu'). No dedicated
# pulsar user is created, so job output files end up owned by the cluster
# user on every host.
pulsar_user_name: ubuntu
pulsar_create_user: false
pulsar_user: "{{ pulsar_user_name }}"

# ---- Pulsar endpoint (galaxyproject.pulsar) -------------------------------
pulsar_package_version: "0.15.15"
pulsar_server_dir: /opt/pulsar
pulsar_venv_dir: "{{ pulsar_server_dir }}/venv"
pulsar_virtualenv_command: /usr/bin/python3 -m venv
pulsar_config_dir: "{{ pulsar_server_dir }}/config"
pulsar_persistence_dir: "{{ pulsar_server_dir }}/files/persisted_data"

pulsar_systemd: true
# Tell galaxyproject.pulsar to notify our "Restart Pulsar" handler (defined in
# handlers/main.yml). The role ships its own same-named handler that never
# actually restarts systemd, so we point it at ours via this var.
pulsar_restart_handler_name: Restart Pulsar
pulsar_systemd_runner: webless
pulsar_systemd_environment: >-
  {{ ['DRMAA_LIBRARY_PATH=' ~ pulsar_drmaa_library_path] if pulsar_scheduler == 'slurm' else [] }}

pulsar_optional_dependencies: >-
  {{ ['pycurl', 'requests', 'psutil']
     + (['kombu', 'pyOpenSSL'] if pulsar_connection == 'mq' else ['pulsar-relay-client==0.2.1'])
     + (['drmaa'] if pulsar_scheduler == 'slurm' else []) }}

# usegalaxy.eu's MQ runners use the manager "production".
pulsar_manager_name: "{{ 'production' if pulsar_connection == 'mq' else '_default_' }}"

# RabbitMQ account. For the testing phase the client autogenerates the user
# (galaxy_<name>_byoc) and a random password, then passes the fully formed
# pyamqp URL here via the role's userRoles vars. Default is empty so the role
# fails clearly if it is not supplied.
pulsar_message_queue_url: ""

pulsar_yaml_config: "{{ pulsar_base_config }}"

pulsar_base_config:
  message_queue_url: "{{ pulsar_message_queue_url }}"
  min_polling_interval: 0.5
  conda_auto_init: false
  conda_auto_install: false
  managers: "{{ {pulsar_manager_name: pulsar_managers[pulsar_scheduler] | combine(pulsar_staging_retries)} }}"

pulsar_managers:
  slurm:
    type: queued_drmaa
  htcondor:
    type: queued_condor
    submit_universe: vanilla

pulsar_staging_retries:
  preprocess_action_max_retries: 10
  preprocess_action_interval_start: 2
  preprocess_action_interval_step: 2
  preprocess_action_interval_max: 30
  postprocess_action_max_retries: 10
  postprocess_action_interval_start: 2
  postprocess_action_interval_step: 2
  postprocess_action_interval_max: 30

pulsar_build_packages:
  Debian: [build-essential, python3-venv, python3-dev, libcurl4-gnutls-dev, libgnutls28-dev]
  RedHat: [gcc, python3-devel, libcurl-devel, openssl-devel]

# slurm-drmaa package (from the Galaxy PPA added by galaxyproject.repos).
pulsar_slurm_drmaa_package:
  Debian: slurm-drmaa1
  RedHat: slurm-drmaa
pulsar_drmaa_library_path: >-
  {{ '/usr/lib/slurm-drmaa/lib/libdrmaa.so.1' if ansible_os_family == 'Debian' else '/lib64/libdrmaa.so.1' }}

# ---- Workers (reference data + containers) ---------------------------------
pulsar_cvmfs: true
cvmfs_role: client
galaxy_cvmfs_repos_enabled: config-rep

# ---- GPUs / limits (written to the connection summary) --------------------
pulsar_min_gpus: 0
pulsar_max_gpus: 0

# ---- Connection summary (display, no secrets) -----------------------------
pulsar_summary_file: "{{ pulsar_server_dir }}/byoc-connection.yml"

# Secrets file (username + password) placed next to the summary. It is NOT part
# of byoc-connection.yml (which is intentionally password-free) because the
# autogenerated RabbitMQ password must be shown to the user so they can enter
# it in the Galaxy BYOC form. The reverse proxy (FORC) auth-gates access, so a
# separate 0600 root-owned file is the safe place to keep it.
pulsar_secrets_file: "{{ pulsar_server_dir }}/byoc-secrets.yml"
