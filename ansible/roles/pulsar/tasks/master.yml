---
# Pulsar host = the BiBiGrid master.
#
# Reuses what BiBiGrid already set up on the master:
#   * a working Slurm controller (we only add the slurm-drmaa library)
#   * the /vol/spool NFS share (exported here, mounted on the workers)
#   * the existing cluster user (ubuntu)
#
# Only the Pulsar-specific work is done here: build deps + DRMAA, the
# galaxyproject.pulsar endpoint service, the staging/deps dirs on /vol/spool,
# and the byoc-connection.yml summary.

- name: Assert scheduler/connection settings for the testing phase
  ansible.builtin.assert:
    that:
      - pulsar_scheduler in ['slurm', 'htcondor']
      - pulsar_connection in ['mq', 'relay']
      - pulsar_message_queue_url is match('^(py)?amqps?://[^:@/]+:[^@]+@')
    fail_msg: >-
      pulsar_scheduler and pulsar_connection must be set, and
      pulsar_message_queue_url must be pyamqp://USER:PASSWORD@HOST:PORT//VHOST?ssl=1
      (autogenerated by the client for the testing phase).

# Large uploads to Galaxy stall when a path drops ICMP "fragmentation needed".
- name: Let TCP detect MTU black holes
  ansible.posix.sysctl:
    name: net.ipv4.tcp_mtu_probing
    value: "1"
    sysctl_file: /etc/sysctl.d/90-pulsar-byoc.conf

# ---- Staging/dependency dirs on the shared /vol/spool ----------------------
# These live on BiBiGrid's existing NFS share, so the workers see the same
# directories. Owned by the existing cluster user (no dedicated pulsar user).
- name: Ensure the shared directory exists
  ansible.builtin.file:
    path: "{{ pulsar_shared_dir }}"
    state: directory
    mode: "0755"

- name: Create the Pulsar staging and dependency directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ pulsar_user_name }}"
    mode: "0775"
  loop:
    - "{{ pulsar_staging_dir }}"
    - "{{ pulsar_dependencies_dir }}"

# ---- Pulsar endpoint -------------------------------------------------------
- name: Install build dependencies for Pulsar
  ansible.builtin.package:
    name: "{{ pulsar_build_packages[ansible_os_family] }}"
    state: present

- name: Add the package source for the SLURM DRMAA library
  ansible.builtin.include_role:
    name: galaxyproject.repos
  when: pulsar_scheduler == 'slurm'

- name: Install the SLURM DRMAA library
  ansible.builtin.package:
    name: "{{ pulsar_slurm_drmaa_package[ansible_os_family] }}"
    state: present
  when: pulsar_scheduler == 'slurm'

- name: Install and configure the Pulsar endpoint
  ansible.builtin.include_role:
    name: galaxyproject.pulsar

# Apply the Pulsar service restart (notified by galaxyproject.pulsar) before we
# write the connection summary. The handler lives in handlers/main.yml.
- name: Apply Pulsar config changes before checking the connection
  ansible.builtin.meta: flush_handlers

# For mq (the testing phase) we do not verify the connection; the account is
# autogenerated and the user enters it in the Galaxy BYOC form. The relay
# connection check from pulsar-byoc is omitted for now.
- name: Record the connection state
  ansible.builtin.set_fact:
    pulsar_connected_state: >-
      {{ 'not checked (mq)' if pulsar_connection == 'mq'
         else 'relay check not implemented in the cluster role yet' }}

- name: Write the connection summary for the Galaxy BYOC form
  ansible.builtin.template:
    src: templates/byoc-connection.yml.j2
    dest: "{{ pulsar_summary_file }}"
    owner: root
    group: root
    mode: "0644"

- name: Write the autogenerated credentials (shown to the user, not in the summary)
  ansible.builtin.template:
    src: templates/byoc-secrets.yml.j2
    dest: "{{ pulsar_secrets_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Read the connection summary
  ansible.builtin.slurp:
    src: "{{ pulsar_summary_file }}"
  register: _pulsar_summary

- name: Show the connection summary
  ansible.builtin.debug:
    msg: "{{ (_pulsar_summary.content | b64decode).splitlines() }}"
