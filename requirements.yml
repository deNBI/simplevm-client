roles:
  - name: oefenweb.rstudio_server
    version: v5.2.1

  - name: oefenweb.latest_r
    version: v4.0.0

  - name: andrewrothstein.conda-env

  # Galaxy roles for the BiBiGrid cluster 'pulsar' userRole
