  # master and available when the role runs; no network fetch at cluster start.
  - name: galaxyproject.pulsar
    version: 1.0.11
  - name: galaxyproject.repos
    version: 0.0.3
  - name: galaxyproject.cvmfs
    version: 0.5.2
  - name: usegalaxy_eu.apptainer
    version: 0.0.4
