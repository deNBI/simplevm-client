---
- name: Install Docker CE
  hosts: all
  become: true
  vars:
    arch_map: { x86_64: amd64, aarch64: arm64 }
    docker_arch: "{{ arch_map[ansible_architecture] | default(ansible_architecture) }}"

  tasks:
    - name: Install prerequisites
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg]
        state: present
        update_cache: true
        cache_valid_time: 3600
      tags: [ 'always' ]

    - name: Ensure keyring dir exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
      tags: [ 'always' ]

    - name: Fetch Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
        force: false
      tags: [ 'always' ]

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ docker_arch }} signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present
        update_cache: true
      tags: [ 'always' ]

    - name: Install Docker Engine
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
      tags: [ 'always' ]

    - name: Enable and start docker + containerd
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop: [docker.service, containerd.service]
      tags: [ 'always' ]

    - name: Add invoking user to docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true
      when:
        - ansible_user is defined
        - ansible_user != 'root'
      tags: [ 'always' ]
