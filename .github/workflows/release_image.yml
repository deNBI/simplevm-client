name: Create Release Image
on:
  push:
    tags:
      - '*'

jobs:
  release:
    uses: denbi/portal-github-actions/.github/workflows/release-image.yml@main
    with:
      image_name: oci.bi.denbi.de/simplevm/simplevm-client
      image_tag: ${{ github.ref_name }}
      dockerfile: Dockerfile
      notify_matrix: true
    secrets:
      OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
      OCI_TOKEN: ${{ secrets.OCI_TOKEN }}
      CUSTOM_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MATRIX_ACCESS_TOKEN: ${{ secrets.matrix_access_token }}
      MATRIX_ROOM: ${{ secrets.MATRIX_CRITICAL_ROOM }}
