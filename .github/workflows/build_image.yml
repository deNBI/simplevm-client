name: build-image
on:
    pull_request:
    workflow_dispatch:
jobs:
    build-test:
        runs-on: [ubuntu-latest]
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

            - name: Build and Scan Image
              uses: denbi/portal-github-actions/build-and-scan-image@3df71e2c34a45ce42aa7063ae3be3b1eee88d70b # main
              with:
                image: localbuild/simplevm-client:${{ github.sha }}
                dockerfile: Dockerfile
                username: ${{ secrets.OCI_USERNAME }}
                password: ${{ secrets.OCI_TOKEN }}
                notify_matrix: false
