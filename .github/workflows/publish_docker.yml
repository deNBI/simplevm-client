name: Publish Docker
on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
      - 'staging'
      - 'dev'

jobs:
  publish:
    uses: denbi/portal-github-actions/.github/workflows/publish-branch-image.yml@3df71e2c34a45ce42aa7063ae3be3b1eee88d70b # main
    with:
      image_name: oci.bi.denbi.de/simplevm/simplevm-client
      dockerfile: Dockerfile
      runs_on: '["ubuntu-latest"]'
    secrets:
      OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
      OCI_TOKEN: ${{ secrets.OCI_TOKEN }}
      CUSTOM_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
